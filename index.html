<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container py-4 py-md-5">
    <section class="bookmarker-wrapper">
      <h1 class="main-title text-center mb-0">Bookmarker</h1>
      <hr class="dotted-separator" />

      <h2 class="section-heading text-center mb-4">
        <i class="bi bi-bookmark-heart-fill me-2"></i>
        Bookmark your favorite sites
        <i class="bi bi-bookmark-heart-fill ms-2"></i>
      </h2>

      <form class="mb-4 bookmark-form">
        <div class="mb-3">
          <label for="siteName" class="form-label">
            <i class="bi bi-card-text me-2"></i>Site Name
          </label>
          <input
            type="text"
            class="form-control"
            id="siteName"
            placeholder="Bookmark Name"
          />
          <p class="error-message text-danger small d-none">Please enter a valid site name (3+ characters).</p>
        </div>

        <div class="mb-4">
          <label for="siteUrl" class="form-label">
            <i class="bi bi-link-45deg me-2"></i>Site URL
          </label>
          <input
            type="url"
            class="form-control"
            id="siteUrl"
            placeholder="Website URL"
          />
          <p class="error-message text-danger small d-none">Please enter a valid URL.</p>
        </div>

        <div class="text-center">
          <button type="button" class="btn btn-submit" id="submitBtn">
            <i class="bi bi-plus-circle me-1"></i>Submit
          </button>
        </div>
      </form>

      <hr class="dotted-separator" />

      <div class="table-wrapper mt-3">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th scope="col" class="text-center">Index</th>
                <th scope="col">Website Name</th>
                <th scope="col" class="text-center">Visit</th>
                <th scope="col" class="text-center">Delete</th>
              </tr>
            </thead>
            <tbody id="bookmarksTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="script.js"></script>
</body>
</html>
